<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CAST · Print Room</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/admin-shell.css" />
    <link rel="stylesheet" href="/setup.css" />
    <link rel="stylesheet" href="/cast-config.css" />
    <link rel="stylesheet" href="/cube-surfaces.css" />
    <script type="module" src="/cast-config.js"></script>
  </head>
  <body>
    <main class="admin-main setup">
      <header class="admin-topbar">
        <div>
          <p class="admin-eyebrow">CUBE / CAST</p>
          <h1>CAST 功能卡片</h1>
          <p class="admin-subtitle">按用途选择卡片，在实际尺寸中预览。</p>
        </div>
      </header>
      <p id="cast-message" role="status" class="message"></p>
      <div class="cast-config-columns">
        <section class="admin-panel">
          <form id="cast-form">
            <h2>选择卡片</h2>
            <label class="cast-check"><input type="checkbox" id="cast-status" />打印状态</label>
            <p class="hint">任务名称、进度、剩余时间和层数。</p>
            <label class="cast-check"><input type="checkbox" id="cast-summary" />任务总结</label>
            <p class="hint">封面、任务名称和预计结束时间。</p>
            <h3>AMS 耗材</h3>
            <div id="cast-units"></div>
            <p class="hint">可跟随当前耗材，也可固定一个或多个单元。</p>
            <label
              >卡片语言<select id="cast-language">
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
              </select></label
            ><label
              >预览尺寸<select id="cast-size">
                <option value="128">128 × 128</option>
                <option value="113">113 × 113</option>
                <option value="136.375">136.375 × 136.375</option>
              </select></label
            >
            <h3>同步到 CUBE</h3>
            <label>CUBE 地址<input id="cast-cube-url" type="url" placeholder="http://192.168.1.50" /></label
            ><label>卡片服务地址<input id="cast-dashboard-url" type="url" placeholder="http://192.168.1.51:3030" /></label>
            <p class="hint">当前限制：每同步一张 CAST 功能卡，也会在 CUBE 自定义卡片中增加一张综合卡；尚不支持仅新增 CAST 卡片。</p>
            <p class="hint">取消勾选仅停止后续同步，不自动删除已有卡片或面板布局。</p>
            <div class="actions">
              <button type="submit">保存配置</button><button type="button" id="cast-authorize" class="secondary">连接 CUBE</button
              ><button type="button" id="cast-sync" class="secondary">保存并同步卡片</button>
            </div>
          </form>
        </section>
        <section class="admin-panel">
          <h2>实际尺寸预览</h2>
          <p class="hint">显示比例 100%；每张卡只承担一类信息。</p>
          <div id="cast-previews" class="cast-previews"></div>
          <p id="cast-profile-count" class="hint"></p>
        </section>
      </div>
    </main>
  </body>
</html>
