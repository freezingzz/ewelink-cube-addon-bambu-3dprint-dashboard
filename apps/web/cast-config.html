<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CAST · Print Room</title>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/admin-shell.css" />
    <link rel="stylesheet" href="/setup.css" />
    <link rel="stylesheet" href="/cast-config.css" />
    <link rel="stylesheet" href="/cube-surfaces.css" />
    <script type="module" src="/cast-config.js"></script>
  </head>
  <body>
    <main class="admin-main setup">
      <header class="admin-topbar">
        <div>
          <p class="admin-eyebrow">CUBE / CAST</p>
          <h1>CAST 配置</h1>
          <p class="admin-subtitle">
            在 CAST 面板编辑器中添加打印仪表盘，点卡片右下角切换尺寸，再保存。
          </p>
        </div>
      </header>
      <p id="cast-message" role="status" class="message"></p>
      <div class="cast-config-columns">
        <section class="admin-panel">
          <form id="cast-form">
            <h2>打印仪表盘</h2>
            <label
              >卡片语言<select id="cast-language">
                <option value="zh-CN">简体中文</option>
                <option value="en">English</option>
              </select></label
            >
            <label>预览尺寸<select id="cast-size"></select></label>
            <label>预览屏幕<select id="cast-host"></select></label>
            <fieldset id="cast-management" disabled>
              <legend>同步到 CUBE</legend>
              <label
                >CUBE 地址<input
                  id="cast-cube-url"
                  type="url"
                  placeholder="http://192.168.1.50"
              /></label>
              <label
                >卡片服务地址<input
                  id="cast-dashboard-url"
                  type="url"
                  placeholder="http://192.168.1.51:3030"
              /></label>
              <div class="actions">
                <button type="submit">保存配置</button>
                <button type="button" id="cast-authorize" class="secondary">
                  连接 CUBE
                </button>
                <button type="button" id="cast-sync" class="secondary">
                  保存并同步卡片
                </button>
              </div>
            </fieldset>
          </form>
        </section>
        <section class="admin-panel">
          <h2>实际尺寸预览</h2>
          <p class="hint" id="cast-dimensions"></p>
          <div id="cast-previews" class="cast-previews">
            <div class="cast-preview-surface">
              <iframe
                id="cast-frame"
                title="打印仪表盘"
                sandbox="allow-scripts allow-same-origin"
              ></iframe>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
